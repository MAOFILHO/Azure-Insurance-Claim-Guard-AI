name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    name: Install, compile and import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # No --pre: the azure-ai-projects==2.0.0b4 pin already allows that one
      # prerelease, and --pre would also pull httpx 1.0.dev, which breaks it.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q app labs utils

      # The labs and web app need live Azure credentials, so CI only checks
      # that the app imports with placeholder settings.
      - name: Import web app
        env:
          PROJECT_ENDPOINT: https://example.invalid/api/projects/ci
          MODEL_DEPLOYMENT_NAME: ci-placeholder
        run: python -c "import app.main"
